# base.yaml — what every target repo inherits: the stock phase graphs, the loop
# bounds, and the engine-wide defaults. NO agents and NO quality checks live
# here, because those are the two things that are genuinely per-repo:
#
#   agents   come from a roster (config/rosters/*.yaml) — model staffing
#   quality  comes from the repo itself — nobody else knows its test command
#
# A repo's own config extends a roster, which extends this file. Three layers,
# each answering one question: what runs (here), who runs it (roster), against
# what (the repo).

defaults:
  coding_agent: pi
  thinking: medium
  harness_engineering: []
  # Reachable-and-worth-protecting only. The engine itself lives outside the
  # target repo now, so `writes` cannot reach it at all — a structural guarantee
  # that replaces the old pattern list. What remains is the repo's own factory
  # surface: an agent must not edit the config that decides how it is judged.
  protected_files:
    - sssf.config.yaml
    - .sssf/
  data_dir: .sssf/data

  # What an agent process may read from the engineer's shell.
  #
  # `operator_env()` hands an agent the WHOLE environment, and for toolchains
  # that is the point — an agent's `bash` should resolve the same `node` the
  # engineer gets. For credentials it is not: every unrelated key in the shell
  # otherwise reaches every agent on every repo, and `writes:` does not help,
  # because it bounds what an agent may CHANGE, never what it may read or send.
  #
  # `allow` is an EXCEPTION to `deny`, checked first, for the case where an
  # agent genuinely needs one credential the deny list would otherwise catch.
  #
  # It is EMPTY, and that is a measured result rather than an oversight. pi
  # keeps its provider credentials in ~/.pi/agent/auth.json — a file, not the
  # environment — for openrouter, deepseek, moonshotai, github-copilot and
  # openai-codex alike. Probed directly: `env -u OPENROUTER_API_KEY pi -p
  # --provider openrouter …` answers normally. So the harness needs HOME, which
  # is essential and never withheld, and no key from the shell at all.
  #
  # Local and open providers (lmstudio, commandcode) need even less.
  #
  # Add an entry here only when something an AGENT'S TOOLS run needs it — a
  # private npm registry token for `npm ci`, say — and prefer putting that in
  # the repo's own config rather than the shared roster.
  env:
    deny:
      - "*_KEY"
      - "*_SECRET"
      - "*_TOKEN"
      - "*_PASSWORD"
      - "*_CREDENTIALS"
      - "AWS_ACCESS_KEY_ID"
    allow: []

# Kinds of work, and the floor a model must clear to do them.
#
# Four rosters reached for this vocabulary independently in their comments —
# "judgement seats", "mechanical lanes", "cast by lane type". It was a real
# taxonomy with no name the schema knew, so nothing could act on it: `sf doctor`
# reported OK for any model that RESOLVED, including a 9B local model staffed as
# the builder.
#
# `agents:` maps the lane onto the roster by NAME, which is why the six shipped
# rosters needed no edit. An agent may override with its own `lane:`.
#
# The floors are CALIBRATED, not guessed. Every model the shipped rosters staff
# has at least 272K of context; the smallest is `openai-codex/gpt-6-astra` at
# 272,000. 200,000 therefore passes everything that ships today and refuses a
# 64K local model from the seats where truncation would be silent.
#
# A floor is not a promise. A model above it can still be bad at the work; a
# model below it WILL truncate, which is a different and detectable kind of
# wrong — and the only kind a config file can check.
lanes:
  judgement:
    description: Plans and verdicts. A wrong answer here costs a build cycle.
    agents: [planner, reviewer]
    min_context: 200000
    reasoning: true
  build:
    description: Writes the code, and re-reads it on every repair round.
    agents: [builder]
    min_context: 200000
    reasoning: true
  mechanical:
    description: Reads and reports. Small models belong here.
    agents: [scout, documenter]
    min_context: 32000
    # reasoning omitted: not required, not refused.


observability:
  db: .sssf/data/sssf.db
  poll_ms: 500

# Loop bounds and truncation ceilings. These were module constants at the top of
# each ADW script (MAX_FIX_LOOPS, MAX_REVISION_LOOPS, JSON_FIX_ATTEMPTS), so a
# repo that wanted a longer repair budget had to edit a workflow every other repo
# shared. Override any of them in your own config.
limits:
  max_fix_loops: 3
  max_revision_loops: 2
  json_fix_attempts: 2
  max_diff_lines: 2000

# Where work products land. Prompts reference these, so a repo that keeps specs
# under docs/rfcs/ says so once here instead of editing agent prompts.
paths:
  specs: specs/
  docs: docs/

# ─── stock workflows ─────────────────────────────────────────────────────────
# One entry per Python file the original factory shipped. Same phases, same
# gates, same bounds — declared instead of coded, so a repo can retune one
# without forking all of them.

workflows:

  scout:
    description: Read-only recon. Just looking for stuff.
    # Reads source; installs nothing. Measured: this workflow used to run
    # `npm ci` against a Tauri repo — wiping and reinstalling node_modules —
    # before looking at a single file.
    needs_prepare: false
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: scout
        owner: scout
        output: ScoutOutput
        gates: [artifacts_exist]
        description: Find and report where things live — change nothing

  ask:
    description: One agent, one prompt. Override the agent with --owner.
    needs_prepare: false           # one question, one answer; no tree needed
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: answer
        owner: builder
        output: GenericOutput
        description: Answer the ask directly, with no surrounding chain

  onboard:
    description: Assess a repo and propose the quality checks `sf init` could not infer.
    # The whole point is to run BEFORE the config is trustworthy, so it cannot
    # require a prepared tree: `prepare:` is the very thing this establishes.
    needs_prepare: false
    steps:
      - step: request
        description: Capture what this repo is and how its people say it is verified
      - step: agent
        name: assess
        owner: scout
        output: ScoutOutput
        gates: [artifacts_exist, files_non_empty]
        description: Read how this repo verifies itself and propose the checks the
                     manifest scan cannot see — every one cited to where it was found

  plan:
    description: Turn a request into an implementable spec. No code.
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: plan
        owner: planner
        output: PlanOutput
        gates: [artifacts_exist, files_non_empty]
        description: Turn the request into an implementable plan

  build:
    description: One-shot implementation, no plan and no verification.
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: build
        owner: builder
        output: BuildOutput
        gates: [diff_matches_claims]
        description: Implement the request directly

  plan_build:
    description: Planner then builder. No verification.
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: plan
        owner: planner
        output: PlanOutput
        gates: [artifacts_exist, files_non_empty]
        description: Turn the request into an implementable plan
      - step: agent
        name: build
        owner: builder
        output: BuildOutput
        previous: plan
        gates: [diff_matches_claims]
        description: Implement the plan exactly

  build_test:
    description: Builder, then the suite with a bounded repair loop.
    accept: verified
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: build
        owner: builder
        output: BuildOutput
        gates: [diff_matches_claims]
        description: Implement the request directly
      - step: verify_loop
        name: test
        group: test
        description: Run the suite — a known command, so code runs it and no agent
                     has to rediscover it
        repair:
          step: agent
          name: fix
          owner: builder
          output: BuildOutput
          gates: [diff_matches_claims]
          retries: 1
          description: Repair what the suite reported, from its verbatim output

  build_review:
    description: Builder, then a reviewer with a bounded revision loop.
    accept: verified
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: build
        owner: builder
        output: BuildOutput
        gates: [diff_matches_claims]
        description: Implement the request directly
      - step: review_loop
        name: review
        owner: reviewer
        output: ReviewOutput
        previous: build
        gates: [artifacts_exist, verdict_consistent]
        description: Confirm the build is what was actually asked for
        repair:
          step: agent
          name: revise
          owner: builder
          output: BuildOutput
          gates: [diff_matches_claims]
          retries: 1
          description: Close the reviewer's blocking findings

  quality:
    description: Deterministic checks only — no agent runs at all.
    accept: verified
    steps:
      - step: request
        description: Capture why quality verification was requested
      - step: quality
        name: quality
        group: full
        description: Run every deterministic check this repo declares

  document:
    description: Write up work already done, from the diff against main.
    steps:
      - step: request
        description: Capture the incoming ask
      - step: changes
        name: changes
        base: main
        description: Diff the working tree against main — the change to be written up
      - step: agent
        name: document
        owner: documenter
        output: DocumentOutput
        previous: changes
        gates: [artifacts_exist, files_non_empty]
        retries: 1
        description: Turn the captured diff into a write-up an engineer can read

  sdlc:
    description: Plan, build, then the suite with a bounded repair loop.
    accept: verified
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: plan
        owner: planner
        output: PlanOutput
        gates: [artifacts_exist, files_non_empty]
        description: Turn the request into an implementable plan
      - step: agent
        name: build
        owner: builder
        output: BuildOutput
        previous: plan
        gates: [diff_matches_claims]
        description: Implement the plan exactly
      - step: verify_loop
        name: test
        group: test
        description: Run the suite — a known command, so code runs it and no agent
                     has to rediscover it
        repair:
          step: agent
          name: fix
          owner: builder
          output: BuildOutput
          gates: [diff_matches_claims]
          retries: 1
          description: Repair what the suite reported, from its verbatim output

  sdlc_quality:
    description: sdlc, plus every deterministic check at the end.
    accept: verified
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: plan
        owner: planner
        output: PlanOutput
        gates: [artifacts_exist, files_non_empty]
        description: Turn the request into an implementable plan
      - step: agent
        name: build
        owner: builder
        output: BuildOutput
        previous: plan
        gates: [diff_matches_claims]
        description: Implement the plan exactly
      - step: verify_loop
        name: test
        group: test
        description: Run the suite before the wider checks — the fastest signal first
        repair:
          step: agent
          name: fix
          owner: builder
          output: BuildOutput
          gates: [diff_matches_claims]
          retries: 1
          description: Repair what the suite reported, from its verbatim output
      - step: quality
        name: quality
        group: full
        when: verified
        description: Lint, typecheck and build once the suite is green

  simple_sdlc:
    description: Plan, build, test, review, document — three commits, three authors.
    accept: verified
    accept_reason: the suite or the review never came back clean
    # Pinned before the first commit phase: by then the run has moved the branch
    # itself, so "what changed" would be measured against its own output.
    pin_baseline: true
    steps:
      - step: request
        description: Capture the incoming ask
      - step: agent
        name: plan
        owner: planner
        output: PlanOutput
        gates: [artifacts_exist, files_non_empty]
        description: Turn the request into an implementable plan
      - step: commit
        name: commit_plan
        source: plan
        description: Put the spec on record before any code exists to blur it
      - step: agent
        name: build
        owner: builder
        output: BuildOutput
        previous: plan
        gates: [diff_matches_claims]
        description: Implement the plan exactly
      - step: verify_loop
        name: test
        group: test
        description: Run the suite — a known command, so code runs it and no agent
                     has to rediscover it
        repair:
          step: agent
          name: fix
          owner: builder
          output: BuildOutput
          gates: [diff_matches_claims]
          retries: 1
          description: Repair what the suite reported, from its verbatim output
      - step: review_loop
        name: review
        owner: reviewer
        output: ReviewOutput
        previous: build
        gates: [artifacts_exist, verdict_consistent]
        description: Confirm the build matches the plan
        repair:
          step: agent
          name: revise
          owner: builder
          output: BuildOutput
          gates: [diff_matches_claims]
          retries: 1
          description: Close the reviewer's blocking findings
      # A revision edited code after the suite last ran, so that green result is
      # stale. Re-earn it rather than commit on a verdict that predates the change.
      - step: quality
        name: retest
        group: test
        when: revised_and_approved
        description: Re-run the suite after a revision changed code post-green
      # Red checks or a rejected review stop the chain here: the code stays
      # uncommitted and nothing is documented, because there is nothing worth
      # describing yet. The plan commit stands — it records what was asked.
      - step: group
        when: verified
        description: Land, measure, and write up a change that passed both questions
        steps:
          - step: commit
            name: commit_build
            source: build
            description: Land the code only now — green checks, approved review
          - step: changes
            name: changes
            base: baseline
            description: Diff the whole run against its pinned baseline, for the documenter
          - step: agent
            name: document
            owner: documenter
            output: DocumentOutput
            previous: changes
            gates: [artifacts_exist, files_non_empty]
            retries: 1
            description: Write up the completed change
          - step: commit
            name: commit_docs
            source: document
            description: Ship the write-up in its own commit, beside the code it describes
