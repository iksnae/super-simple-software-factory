# Extends the stock workflows, limits, and paths in config/base.yaml.
# This file's job is ONE thing: model staffing.
extends: config/base.yaml

# roster: commandcode — open weights through pi's commandcode provider.
# GLM-5.3 judges, Kimi K2.7-Code builds, glm-5.3-flash runs the cheap lanes.
#
# Known as: the commandcode roster, the cc roster. Same file.
#
#   sf run sdlc "<request>" --repo <path> --roster commandcode
#
# WHY THIS ROSTER EXISTS
# pi is the factory's harness and it carries a commandcode catalog of 69 models
# — Kimi, GLM, Qwen, DeepSeek, MiniMax, Step, grok — that no shipped roster
# staffed. Every other roster here is `openrouter/…` or `openai-codex/…`. This
# one leans on the open-weight lane instead.
#
# WHAT WAS MEASURED, AND WHEN
# commandcode is PLAN-GATED and METERED. Probed 2026-09-10 with a one-word
# prompt through `pi -p --provider commandcode`, ~8K tokens each:
#
#     moonshotai/Kimi-K3                      $0.02292   in plan
#     Qwen/Qwen3.8-Max                        $0.01705   in plan
#     xai/grok-4.6                            $0.01757   in plan
#     zai-org/GLM-5.3                         $0.01062   in plan
#     moonshotai/Kimi-K2.7-Code               $0.00667   in plan
#     deepseek/deepseek-v4-pro                $0.00551   in plan
#     MiniMaxAI/MiniMax-M3                    $0.00240   in plan
#     deepseek/deepseek-v4-flash              $0.00181   in plan
#     stepfun/Step-3.7-Flash                  $0.00170   in plan
#     Qwen/Qwen3.8-Flash                      $0.00135   in plan
#     z-ai/glm-5.3-flash                      $0.00109   in plan
#     inclusionai/ling-3.0-flash-sante:free   $0         in plan
#     claude-sonnet-5                         403 MODEL_NOT_IN_PLAN
#     meta/muse-spark-1.3[-contributor]       stream error (see below)
#
# The Claude models in the commandcode catalog are NOT in this plan — a roster
# naming one fails at the first agent call, after the run has already spent on
# whatever came before it. `sf doctor` cannot catch that: it confirms a model
# RESOLVES in the catalog, never that the plan or the provider will serve it.
# Re-probe before restaffing a lane; a catalog entry is not an entitlement.
#
# muse-spark is wanted here as the small lane and is not usable yet. On
# commandcode it returns "Stream error occurred" with zero tokens; the same
# model on openrouter returns 403 "requires 18+ age confirmation. Confirm at
# https://openrouter.ai/settings/preferences". That is an account setting, not
# a config change. Once confirmed, probe it and it can take the scout or
# documenter lane — the commented block at the bottom of each is ready for it.
defaults:
  coding_agent: pi
  # Cheapest lane that works, so an agent with no explicit model is cheap by
  # default rather than expensive by accident.
  model: commandcode/z-ai/glm-5.3-flash
  thinking: high                   # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []
  tools:
    - read
    - bash
    - edit
    - write
    - grep                         # pi default: OFF
    - find                         # pi default: OFF
    - ls                           # pi default: OFF

agents:
  - name: planner
    # Judgement seat. GLM-5.3 is the strongest open model here per dollar:
    # a third the cost of Kimi K3 and half of Qwen3.8-Max / grok-4.6.
    model: commandcode/zai-org/GLM-5.3
    color: "#a78bfa"
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: config/prompts/planner/system.md
      user: config/prompts/planner/user.md
    harness_engineering:
      - config/harness/subagents.ts    # registers the four subagent_* tools below
    writes:                        # the plan is the only thing it may leave in the repo
      - "{{specs_dir}}/"
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    # Code-specialised and 3.4x cheaper than Kimi K3, which is the same family
    # without the code tuning. The builder runs more turns than any other agent
    # — every repair round is another one — so its rate compounds hardest.
    model: commandcode/moonshotai/Kimi-K2.7-Code
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: config/prompts/builder/system.md
      user: config/prompts/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    # Inherits the default glm-5.3-flash: mechanical recon, cheapest lane that
    # works. This is the seat muse-spark is wanted in once it is unblocked.
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: config/prompts/scout/system.md
      user: config/prompts/scout/user.md
    harness_engineering:
      - config/harness/subagents.ts
    writes: []                     # read-only: findings go to context_handoff/, which is
                                   # runtime, not the repo
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write                      # so scout_findings.md lands without a bash heredoc
      - subagent_create
      - subagent_continue
      - subagent_list
      - subagent_remove

  # No tester agent: running the suite is a known command, so it is a `quality`
  # or `verify_loop` step over the repo's own config. See SKILL.md hard rule 8.

  - name: reviewer
    # Same seat strength as the planner, and for the same reason: judging a
    # build against a spec is the same work as writing the spec.
    model: commandcode/zai-org/GLM-5.3
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: config/prompts/reviewer/system.md
      user: config/prompts/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    # Reads a diff and writes once — no judgement seat, so a small model.
    # Qwen3.8-Flash over the default glm-5.3-flash for prose length.
    model: commandcode/Qwen/Qwen3.8-Flash
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: config/prompts/documenter/system.md
      user: config/prompts/documenter/user.md
    writes:                        # documentation only — a rule now, not a line in a
      - "{{docs_dir}}/"            # prompt the model may drift from
      - docs/
      - "**/*.md"
      - "*.md"
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit
